    <text x="26" y="16" text-anchor="middle" fill="#ecb613" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">1 kyu</text>
  </g>
  <!-- Username & Honor -->
  <text x="118" y="17" fill="#efefef" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.3">peterlodri-sec</text>
  <text x="118" y="31" fill="#999c9f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">8b-is · Rust · Zig · Idris 2 · C · Go · Perl</text>
  <!-- Honor Pill -->
  <rect x="322" y="9" width="68" height="22" rx="4" fill="#111215" stroke="#2f3137" stroke-width="1"/>
  <text x="356" y="24" text-anchor="middle" fill="#00e5ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">★ 1,729</text>
